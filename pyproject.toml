[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kvsim"
version = "0.1.0"
description = "Mini KV-cache-aware router simulator for multi-turn VLM serving"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "matplotlib>=3.7"]

[project.optional-dependencies]
dev = ["pytest>=7"]
# router service + benchmark client/mock (Phases 1-4); runs on a laptop, no GPU needed
router = ["aiohttp>=3.9", "pyzmq>=25", "msgspec>=0.18", "pillow>=10"]

[tool.setuptools.packages.find]
include = ["kvsim*", "router*", "bench*", "deploy*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
